<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Tech Radar">
  <style>
    .bg { fill: #1c1c1a; }
    .ring { stroke: #f7f7f5; }
    .dot { fill: #5fd39a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f0f0ec; }
      .ring { stroke: #121211; }
      .dot { fill: #1f7a4d; }
    }
  </style>
  <rect width="32" height="32" rx="7" class="bg" />
  <g class="ring" fill="none" stroke-width="1.6" stroke-linecap="round">
    <circle cx="16" cy="16" r="4.5" />
    <circle cx="16" cy="16" r="9" stroke-opacity="0.5" />
    <path d="M16 16 23.4 9.6" />
  </g>
  <circle cx="23.4" cy="9.6" r="1.8" class="dot" />
</svg>
